[package]
name = "yohaku-loom"
version = "0.1.4"
edition = "2021"
rust-version = "1.75"
description = "Deterministic text macro converter for Yohaku"

[lib]
name = "loom"
path = "src/lib.rs"

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.8"
sha2 = "0.10"
tempfile = "3.9"
libc = "0.2"

[profile.release]
strip = true

