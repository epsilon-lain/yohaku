name: Native Windows preview probe

on:
  push:
    branches: [codex/windows-preview-native-probe]
    paths: ['.github/workflows/native-windows-preview-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Probe the released Windows executables in a disposable workspace
        shell: python
        run: |
          import copy
          import hashlib
          import io
          import json
          import os
          import pathlib
          import shutil
          import subprocess
          import sys
          import time
          import urllib.request
          import zipfile

          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'Yohaku preview probe'
          root.mkdir()
          base = 'https://github.com/epsilon-lain/yohaku/releases/download/v2026.11.17-preview1/'
          name = 'Yohaku-2026.11.17-preview1-windows-x64'
          with urllib.request.urlopen(base + name + '.zip', timeout=30) as response:
              data = response.read(16_000_000)
          assert hashlib.sha256(data).hexdigest() == 'aad7a6b6f25d3e97e859e77c6056491e5203c58428e35581940868f66089b2bc'
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              archive.extractall(root)
          app = root / name
          print('Release ZIP SHA-256 verified.', flush=True)

          desktop = subprocess.Popen([str(app / 'yohaku_windows.exe')], cwd=app)
          try:
              window = 0
              for _ in range(10):
                  if desktop.poll() is not None:
                      break
                  observed = subprocess.run(['powershell', '-NoProfile', '-NonInteractive', '-Command',
                      f'(Get-Process -Id {desktop.pid} -ErrorAction SilentlyContinue).MainWindowHandle'],
                      capture_output=True, text=True, timeout=8)
                  window = int(observed.stdout.strip() or '0')
                  if window:
                      break
                  time.sleep(1)
              print(f'Desktop startup: process_exit={desktop.poll()}, native_window_observed={bool(window)}', flush=True)
          finally:
              if desktop.poll() is None:
                  desktop.terminate()
                  desktop.wait(timeout=10)

          world = root / 'isolated world'
          (world / 'macros').mkdir(parents=True)
          shutil.copyfile(app / 'source/macros/raw.source.md', world / 'macros/raw.source.md')
          sys.path.insert(0, str(app / 'source/agent'))
          from yohaku_windows_socius import WindowsTools
          from yohaku_agent import ToolError

          def native(request):
              result = subprocess.run([str(app / 'yohaku_api.exe'), '--root', str(world)], cwd=app,
                  input=json.dumps(request, ensure_ascii=False).encode('utf-8'), capture_output=True, timeout=15)
              payload = json.loads(result.stdout)
              if not payload.get('ok'):
                  raise ToolError(f'{request["command"]}: {payload.get("error")}')
              return payload['result']

          def open_worker():
              return WindowsTools(native, lambda: {'root': str(world)}, {'read': True, 'write': True, 'run': True})

          def invoke(worker, tool, **arguments):
              received = worker.call(tool, arguments)
              assert received['ok'], f'{tool}: {received}'
              return received['result']

          worker = open_worker()
          seed = '临时记录。\n'
          notes = {'source_version': 1, 'writer': 'windows-fixture', 'summary': 'preserve-me'}
          created = invoke(worker, 'create_document', name='guide.md', body=seed, notes=notes)
          source = created['source']
          before = invoke(worker, 'read_document', source=source)
          edit = dict(source=source, old='临时记录。', new='欢迎使用 Yohaku。 Welcome to Yohaku.', body_only=True)
          assert not worker.call('patch_document', dict(edit, revision='stale-fixture'))['ok']
          assert invoke(worker, 'read_document', source=source)['revision'] == before['revision']
          invoke(worker, 'patch_document', **edit, revision=before['revision'])
          worker = open_worker()
          after = invoke(worker, 'read_document', source=source)
          assert before['revision'] != after['revision']
          assert before['text'].replace(edit['old'], edit['new'], 1) == after['text']
          assert (world / created['output']).read_bytes().decode('utf-8') == after['body']
          print('PASS: actual Windows worker + native API + Loom body rewrite; stale revision refused, metadata preserved, generated bytes match persisted source.', flush=True)

          catalog = invoke(worker, 'catalog_info')
          print('Native catalog info: ' + json.dumps(catalog, ensure_ascii=True), flush=True)
          example = copy.deepcopy(catalog['example'])
          script = invoke(worker, 'create_document', name='probe.py', body='print("yohaku-probe")\n', notes=notes)
          script_read = invoke(worker, 'read_document', source=script['source'])
          example.update(id='windows-preview-probe', source=script['source'], source_revision=script_read['revision'])
          assert (world / script['output']).is_file()
          proposal = invoke(worker, 'catalog_request', request_id='windows-preview-proposal', descriptor=example)
          worker = open_worker()
          persisted = invoke(worker, 'catalog_get', request_id='windows-preview-proposal')
          print('Catalog proposal: ' + json.dumps(proposal, ensure_ascii=True), flush=True)
          print('Reopened catalog: ' + json.dumps(persisted, ensure_ascii=True), flush=True)
          assert 'pending' in json.dumps(persisted)
          print('PASS: a Loom-generated tool proposal persists across native API processes and is pending Techne approval.', flush=True)
